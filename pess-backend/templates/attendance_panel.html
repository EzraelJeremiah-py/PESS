<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Panel - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Attendance Panel</h2>

    <form method="POST">
      <!-- Class Stream -->
      <div class="mb-3">
        <label class="form-label">Class Stream</label>
        <input type="text" name="class" class="form-control" required>
      </div>

      <!-- Student Attendance -->
      <div class="card mb-4">
        <div class="card-header bg-primary text-white">Mark Attendance</div>
        <div class="card-body">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Student Serial</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {% for student in students %}
              <tr>
                <td>{{ student.serial }}</td>
                <td>
                  <select name="student_{{ student.serial }}" class="form-select" required>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                    <option value="Sick">Sick</option>
                    <option value="Excuse">Excuse</option>
                  </select>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100">Save Attendance</button>
    </form>
  </div>
</body>
</html>
