<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Panel - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center fw-bold text-primary">
      <i class="fas fa-user-check"></i> Attendance Panel
    </h2>

    <!-- Teacher's Class Stream -->
    <div class="alert alert-info text-center fw-bold">
      Marking Attendance for <span class="text-primary">{{ session['class_stream'] }}</span>
    </div>

    <form method="POST">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <i class="fas fa-list-check"></i> Students List
        </div>
        <div class="card-body">
          {% if students %}
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Student Serial</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {% for student in students %}
              <tr>
                <td>{{ student.serial }}</td>
                <td>
                  <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="student_{{ student.serial }}" id="present{{ student.serial }}" value="Present" required>
                    <label class="btn btn-outline-success btn-sm" for="present{{ student.serial }}">Present</label>

                    <input type="radio" class="btn-check" name="student_{{ student.serial }}" id="absent{{ student.serial }}" value="Absent">
                    <label class="btn btn-outline-danger btn-sm" for="absent{{ student.serial }}">Absent</label>

                    <input type="radio" class="btn-check" name="student_{{ student.serial }}" id="late{{ student.serial }}" value="Late">
                    <label class="btn btn-outline-warning btn-sm" for="late{{ student.serial }}">Late</label>

                    <input type="radio" class="btn-check" name="student_{{ student.serial }}" id="excuse{{ student.serial }}" value="Excuse">
                    <label class="btn btn-outline-info btn-sm" for="excuse{{ student.serial }}">Excuse</label>

                    <input type="radio" class="btn-check" name="student_{{ student.serial }}" id="sick{{ student.serial }}" value="Sick">
                    <label class="btn btn-outline-secondary btn-sm" for="sick{{ student.serial }}">Sick</label>
                  </div>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
          {% else %}
            <div class="alert alert-warning text-center">
              <i class="fas fa-info-circle"></i> No students found for this class stream.
            </div>
          {% endif %}
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 fw-bold">
        <i class="fas fa-save"></i> Save Attendance
      </button>
    </form>
  </div>
</body>
</html>
