<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Manage Users</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Registered Users</h2>

    {% if users %}
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Serial</th>
            <th>Password</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr class="text-center">
            <td>{{ user.id }}</td>
            <td>{{ user.serial }}</td>
            <td>{{ user.password }}</td>
            <td>
              <a href="{{ url_for('admin.edit_user', id=user.id) }}" class="btn btn-sm btn-warning">Edit</a>
              <a href="{{ url_for('admin.delete_user', id=user.id) }}" class="btn btn-sm btn-danger"
                 onclick="return confirm('Are you sure you want to delete this user?');">
                Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-center text-muted">No users found.</p>
    {% endif %}

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
