<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Logs - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-primary">💬 Chat Logs</h2>
    <div class="list-group">
      {% for msg in chat_messages %}
      <div class="list-group-item">
        <strong>{{ msg['sender'] }}</strong>
        <span class="badge bg-info">{{ msg['channel'] }}</span>
        <p class="mb-1">{{ msg['message'] }}</p>
        {% if msg['tag'] %}
          <span class="badge bg-warning text-dark">{{ msg['tag'] }}</span>
        {% endif %}
        <small class="text-muted">{{ msg['timestamp'] }}</small>
      </div>
      {% endfor %}
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
  </div>
</body>
</html>
