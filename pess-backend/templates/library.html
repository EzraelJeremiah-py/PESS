<div class="container mt-4">
  <h2 class="mb-3">Virtual Library</h2>

  <!-- Upload form -->
  <form method="POST" action="{{ url_for('library.upload_file') }}" enctype="multipart/form-data">
    <input type="file" name="file" class="form-control mb-2" required>
    <button type="submit" class="btn btn-success">Upload</button>
  </form>

  <!-- Files -->
  <h4 class="mt-4">Resources</h4>
  <table class="table table-striped">
    <thead><tr><th>File</th><th>Actions</th></tr></thead>
    <tbody>
      {% for file in files %}
      <tr>
        <td>{{ file.filename }}</td>
        <td>
          <a href="{{ url_for('library.delete_file', file_id=file.id) }}" class="btn btn-danger btn-sm">Delete</a>
          <form method="POST" action="{{ url_for('library.rename_file', file_id=file.id) }}" class="d-inline">
            <input type="text" name="new_name" placeholder="Rename" required>
            <button type="submit" class="btn btn-warning btn-sm">Rename</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <!-- Safe Links -->
  <h4 class="mt-4">Safe Study Links</h4>
  <ul>
    {% for link in links %}
      <li><a href="{{ link.url }}" target="_blank">{{ link.title }}</a> - {{ link.description }}</li>
    {% endfor %}
  </ul>
</div>
