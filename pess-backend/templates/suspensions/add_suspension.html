<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Suspension</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      font-size: 1.6rem;
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      font-size: 1rem;
    }
    label {
      font-weight: 600;
      color: #00e6e6;
      font-size: 1rem;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-success {
      background-color: #00c6ff;
      border: none;
    }
    .btn-success:hover { background-color: #00a3cc; }
    .btn-secondary {
      background-color: #2a5298;
      border: none;
    }
    .btn-secondary:hover { background-color: #1e3c72; }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, li, a, label, input, textarea, select, button {
        font-size: 18px;
      }
      h2 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Add Suspension</h2>
  <form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label fw-bold">Student Name</label>
      <input type="text" name="student_name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">Reason</label>
      <textarea name="reason" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">Start Date</label>
      <input type="date" name="start_date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">End Date</label>
      <input type="date" name="end_date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">Status</label>
      <select name="status" class="form-select">
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Save Suspension</button>
  </form>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
