<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Suspensions Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Suspensions Management</h2>
  <a href="{{ url_for('suspensions.add_suspension') }}" class="btn btn-primary mb-3">Add Suspension</a>
  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th><th>Student</th><th>Reason</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for s in suspensions %}
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.student_name }}</td>
        <td>{{ s.reason }}</td>
        <td>{{ s.start_date }}</td>
        <td>{{ s.end_date }}</td>
        <td>{{ s.status }}</td>
        <td>
          <a href="{{ url_for('suspensions.delete_suspension', id=s.id) }}" class="btn btn-danger btn-sm">Delete</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="7" class="text-center text-muted">No suspensions found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</body>
</html>
