<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suspensions (Public View)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      font-size: 1.6rem;
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
    }
    .table {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
      font-size: 1rem;
    }
    .table thead {
      background: rgba(0,0,0,0.7);
      font-size: 1rem;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-secondary {
      background-color: #2a5298;
      border: none;
    }
    .btn-secondary:hover { background-color: #1e3c72; }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, li, a, th, td {
        font-size: 18px;
      }
      h2 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
      .table thead {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Suspensions (Public View)</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Student</th>
        <th>Reason</th>
        <th>Start</th>
        <th>End</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for s in suspensions %}
      <tr>
        <td>{{ s.student_name }}</td>
        <td>{{ s.reason }}</td>
        <td>{{ s.start_date }}</td>
        <td>{{ s.end_date }}</td>
        <td>{{ s.status }}</td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-center text-muted">No suspensions found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
