<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Suspensions (Public View)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Suspensions (Public View)</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Student</th>
        <th>Reason</th>
        <th>Start</th>
        <th>End</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for s in suspensions %}
      <tr>
        <td>{{ s.student_name }}</td>
        <td>{{ s.reason }}</td>
        <td>{{ s.start_date }}</td>
        <td>{{ s.end_date }}</td>
        <td>{{ s.status }}</td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-center text-muted">No suspensions found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
