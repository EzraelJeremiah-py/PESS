<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Logs - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Attendance Logs</h2>

    <div class="card">
      <div class="card-header bg-primary text-white">
        Full Attendance History
      </div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Student Serial</th>
              <th>Status</th>
              <th>Class Stream</th>
              <th>Date</th>
              <th>Marked By</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody>
            {% for record in attendance_records %}
            <tr>
              <td>{{ record.student_serial }}</td>
              <td>{{ record.status }}</td>
              <td>{{ record.class_stream }}</td>
              <td>{{ record.date }}</td>
              <td>{{ record.marked_by }}</td>
              <td>{{ record.timestamp }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
