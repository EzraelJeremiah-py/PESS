<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Logs - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-primary">📋 Attendance Logs</h2>
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Student</th>
          <th>Class/Stream</th>
          <th>Status</th>
          <th>Marked By</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        {% for record in attendance_records %}
        <tr>
          <td>{{ record['student_name'] }}</td>
          <td>{{ record['class_stream'] }}</td>
          <td>{{ record['status'] }}</td>
          <td>{{ record['marked_by'] }}</td>
          <td>{{ record['date'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
  </div>
</body>
</html>
