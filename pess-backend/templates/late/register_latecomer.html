<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Latecomer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; color:#eee; font-family:"Segoe UI",sans-serif; }
    h2 { background:linear-gradient(90deg,#00c6ff,#0072ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:700; text-align:center; margin-bottom:1.5rem; }
    .card-glass { background:rgba(255,255,255,0.08); border-radius:16px; backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.2); padding:1rem; }
    .btn-gradient { background:linear-gradient(90deg,#00c6ff,#0072ff); border:none; color:#fff; font-weight:600; border-radius:8px; transition:transform 0.2s ease; }
    .btn-gradient:hover { transform:translateY(-2px); box-shadow:0 6px 12px rgba(0,0,0,0.3); }
    @media(max-width:768px){ body,label,input,textarea{font-size:18px} h2{font-size:22px} .btn{width:100%;margin-bottom:10px} }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2>Register Latecomer</h2>
    <form method="POST" class="card-glass p-4 shadow-sm">
      <div class="mb-3"><label class="form-label fw-bold">Student Serial</label><input type="text" name="student_serial" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-bold">Student Name</label><input type="text" name="student_name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-bold">Expected Opening Date</label><input type="date" name="expected_opening" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-bold">Arrival Date</label><input type="date" name="arrival_date" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-bold">Punishment Undertaken</label><input type="text" name="punishment" class="form-control"></div>
      <div class="mb-3"><label class="form-label fw-bold">Reason for Late Arrival</label><textarea name="reason" class="form-control" rows="3"></textarea></div>
      <button type="submit" class="btn btn-gradient w-100">Save Record</button>
    </form>
    <a href="{{ url_for('late.list_latecomers') }}" class="btn btn-secondary mt-3">Back to Latecomers List</a>
  </div>
</body>
</html>
