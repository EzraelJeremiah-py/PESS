<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Latecomer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem;
    }
    h2 {
      color: #fff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    .form-control, .form-select {
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-primary { background-color: #00c6ff; border: none; }
    .btn-primary:hover { background-color: #0099cc; }
    .btn-secondary { background-color: #2a5298; border: none; }
    .btn-secondary:hover { background-color: #1e3c72; }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <h2 class="mb-4">Add Latecomer</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Student Serial</label>
        <input type="text" name="student_serial" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" name="student_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Expected Opening</label>
        <input type="date" name="expected_opening" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Arrival Date</label>
        <input type="date" name="arrival_date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Punishment</label>
        <input type="text" name="punishment" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Reason</label>
        <textarea name="reason" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('late.list_latecomers') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
