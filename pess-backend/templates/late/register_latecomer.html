<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Latecomer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Register Latecomer</h2>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Student Name</label>
        <input type="text" name="student_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Expected Opening Date</label>
        <input type="date" name="expected_opening" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Arrival Date</label>
        <input type="date" name="arrival_date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Punishment Undertaken</label>
        <input type="text" name="punishment" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Reason for Late Arrival</label>
        <textarea name="reason" class="form-control" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Record</button>
    </form>
    <a href="{{ url_for('late.list_latecomers') }}" class="btn btn-secondary mt-3">Back to Latecomers List</a>
  </div>
</body>
</html>
