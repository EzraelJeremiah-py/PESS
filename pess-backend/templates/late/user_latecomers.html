<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Latecomer Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
  <h2 class="mb-4">My Latecomer Records</h2>

  {% if latecomers %}
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-warning">
          <tr>
            <th>Expected Opening</th>
            <th>Arrival Date</th>
            <th>Reason</th>
            <th>Punishment</th>
          </tr>
        </thead>
        <tbody>
          {% for rec in latecomers %}
          <tr>
            <td>{{ rec.expected_opening }}</td>
            <td>{{ rec.arrival_date }}</td>
            <td>{{ rec.reason }}</td>
            <td>{{ rec.punishment }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="alert alert-info">No latecomer record found for you.</div>
  {% endif %}

  <!-- Back to Dashboard -->
  <a href="{{ url_for('user.dashboard') }}" class="btn btn-success mt-3">⬅ Back to Dashboard</a>
</div>
</body>
</html>
