<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Latecomer Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem;
    }
    h2 {
      color: #fff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    .table {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
    }
    .table thead {
      background: rgba(0,0,0,0.7);
    }
    .alert-info {
      background-color: rgba(0,198,255,0.2);
      border: none;
      color: #fff;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2>Your Latecomer Records</h2>

  {% if latecomers %}
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Expected Opening</th>
          <th>Arrival Date</th>
          <th>Punishment</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>
        {% for lc in latecomers %}
        <tr>
          <td>{{ lc.student_name }}</td>
          <td>{{ lc.expected_opening }}</td>
          <td>{{ lc.arrival_date }}</td>
          <td>{{ lc.punishment }}</td>
          <td>{{ lc.reason }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <div class="alert alert-info">No records found.</div>
  {% endif %}
</div>
</body>
</html>
