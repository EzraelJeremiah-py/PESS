<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Latecomer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:linear-gradient(135deg,#1e3c72,#2a5298,#00c6ff); color:#fff; }
    .card { background:rgba(255,255,255,0.1); border-radius:12px; padding:2rem; }
    .form-control,.form-select { border-radius:8px; background:rgba(255,255,255,0.9); }
    .btn { border-radius:8px; font-weight:600; }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <h2 class="mb-4">Add Latecomer</h2>
    <form method="POST">
      <div class="mb-3"><label class="form-label">Student Name</label>
        <input type="text" name="student_name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Reason</label>
        <input type="text" name="reason" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Expected Opening</label>
        <input type="date" name="expected_opening" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Arrival Date</label>
        <input type="date" name="arrival_date" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Punishment</label>
        <input type="text" name="punishment" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
        </select></div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('late.list_latecomers') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
