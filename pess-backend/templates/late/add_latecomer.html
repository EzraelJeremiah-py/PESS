<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Latecomer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="mb-4">Add Latecomer</h2>

  <form method="POST" action="{{ url_for('late.add_latecomer') }}">
    <!-- Student dropdown -->
    <div class="mb-3">
      <label for="student_id" class="form-label">Select Student</label>
      <select class="form-select" id="student_id" name="student_id" required>
        <option value="">-- Choose Student --</option>
        {% for s in students %}
          <option value="{{ s.id }}">
            {{ s.username }} ({{ s.serial }}, {{ s.class_stream }})
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Expected opening -->
    <div class="mb-3">
      <label for="expected_opening" class="form-label">Expected Opening Date</label>
      <input type="date" class="form-control" id="expected_opening" name="expected_opening" required>
    </div>

    <!-- Arrival date -->
    <div class="mb-3">
      <label for="arrival_date" class="form-label">Arrival Date</label>
      <input type="date" class="form-control" id="arrival_date" name="arrival_date" required>
    </div>

    <!-- Reason -->
    <div class="mb-3">
      <label for="reason" class="form-label">Reason</label>
      <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
    </div>

    <!-- Punishment -->
    <div class="mb-3">
      <label for="punishment" class="form-label">Punishment</label>
      <input type="text" class="form-control" id="punishment" name="punishment">
    </div>

    <!-- Status -->
    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status">
        <option value="active" selected>Active</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Add Latecomer</button>
    <a href="{{ url_for('late.list_latecomers') }}" class="btn btn-secondary">Back</a>
  </form>
</div>
</body>
</html>
