<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload School Joining Instructions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold"><i class="fas fa-upload"></i> Upload Instructions</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-3">Upload School Joining Instructions</h2>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="file" class="form-label">Choose File</label>
        <input type="file" name="file" id="file" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>
  </div>
</body>
</html>
