<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Fee Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Upload Fee Records</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h3 class="mb-4">Upload Fee Payment Record</h3>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Class</label>
        <select name="class" class="form-select" required>
          <option value="Form1">Form 1</option>
          <option value="Form2">Form 2</option>
          <option value="Form3">Form 3</option>
          <option value="Form4">Form 4</option>
          <option value="Form5">Form 5</option>
          <option value="Form6">Form 6</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Stream</label>
        <input type="text" name="stream" class="form-control" placeholder="e.g. A, B, Science, Arts" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        <input type="date" name="fee_date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Upload File</label>
        <input type="file" name="file" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-upload me-1"></i> Upload
      </button>
    </form>
  </div>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</body>
</html>
