<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Fee Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #004d40, #00695c, #26a69a);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      color: #fff;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .navbar {
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(192,192,192,0.4); /* silver accent */
    }
    h3 {
      color: #c0c0c0; /* silver */
      font-weight: 700;
      text-shadow: 0 0 8px rgba(192,192,192,0.6);
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(38,166,154,0.4); /* emerald accent */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(38,166,154,0.6);
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-primary {
      background-color: #26a69a; /* emerald */
      border: none;
      color: #fff;
      box-shadow: 0 0 8px rgba(38,166,154,0.6);
    }
    .btn-primary:hover {
      background-color: #1e8e82;
    }
    .btn-secondary {
      background-color: #004d40;
      border: none;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #00332c;
    }
    label {
      color: #c0c0c0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-file-invoice-dollar"></i> Upload Fee Records</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <h3 class="mb-4"><i class="fas fa-upload"></i> Upload Fee Payment Record</h3>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-lg">
      <div class="mb-3">
        <label class="form-label">Class</label>
        <select name="class" class="form-select" required>
          <option value="Form1">Form 1</option>
          <option value="Form2">Form 2</option>
          <option value="Form3">Form 3</option>
          <option value="Form4">Form 4</option>
          <option value="Form5">Form 5</option>
          <option value="Form6">Form 6</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Stream</label>
        <input type="text" name="stream" class="form-control" placeholder="e.g. A, B, Science, Arts" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="fee_date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Upload File</label>
        <input type="file" name="file" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-upload"></i> Upload
      </button>
    </form>

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</body>
</html>
