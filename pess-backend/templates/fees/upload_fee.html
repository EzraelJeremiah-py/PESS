<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Fee Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #001f3f, #003366, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .navbar {
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,198,255,0.4);
      font-size: 1.1rem;
    }
    h3 {
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
      font-size: 1.6rem;
    }
    .card {
      border-radius: 14px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      font-size: 1rem;
    }
    label { font-size: 1.1rem; }
    .btn { border-radius: 8px; font-weight: 600; font-size: 1rem; }
    .btn-primary { background-color: #0074d9; border: none; }
    .btn-primary:hover { background-color: #005fa3; }
    .btn-secondary { background-color: #003366; border: none; color: #fff; }
    .btn-secondary:hover { background-color: #001f3f; }
    @media (max-width: 768px) {
      body, p, li, a, label, input, select { font-size: 18px; }
      h3 { font-size: 22px; }
      .btn { font-size: 18px; }
      .navbar { font-size: 18px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Upload Fee Records</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h3 class="mb-4">Upload Fee Payment Record</h3>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Class</label>
        <select name="class" class="form-select" required>
          <option value="">-- Select Class --</option>
          <option value="Form1">Form 1</option>
          <option value="Form2">Form 2</option>
          <option value="Form3">Form 3</option>
          <option value="Form4">Form 4</option>
          <option value="Form5">Form 5</option>
          <option value="Form6">Form 6</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Stream</label>
        <select name="stream" class="form-select" required>
          <option value="">-- Select Stream --</option>
          <option value="A">Stream A</option>
          <option value="B">Stream B</option>
          <option value="C">Stream C</option>
          <option value="D">Stream D</option>
          <option value="E">Stream E</option>
          <option value="F">Stream F</option>
          <option value="G">Stream G</option>
          <option value="H">Stream H</option>
          <option value="Science">Science</option>
          <option value="Arts">Arts</option>
          <option value="Business">Business</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        <input type="date" name="fee_date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Upload File</label>
        <input type="file" name="file" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-upload me-1"></i> Upload
      </button>
    </form>
  </div>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</body>
</html>
