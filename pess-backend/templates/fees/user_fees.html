<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fee Payment Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Fee Payment Records</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Fee Payment Records</h3>

    {% if fee_files %}
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>Class</th>
            <th>Stream</th>
            <th>Date</th>
            <th>File</th>
            <th>Uploaded At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for f in fee_files %}
          <tr class="text-center">
            <td>{{ f.class }}</td>
            <td>{{ f.stream }}</td>
            <td>{{ f.fee_date }}</td>
            <td>{{ f.filename }}</td>
            <td>{{ f.uploaded_at }}</td>
            <td>
              <a href="{{ f.filepath }}" target="_blank" class="btn btn-info btn-sm">View</a>
              <a href="{{ f.filepath }}" download class="btn btn-success btn-sm">Download</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-center text-muted">No fee records available.</p>
    {% endif %}
  </div>
</body>
</html>
