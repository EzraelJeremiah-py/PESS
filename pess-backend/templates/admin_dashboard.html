{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Admin Dashboard</h2>
  <p class="lead">Welcome, {{ session.get('username') }} 👑</p>

  <!-- Admin tools -->
  <div class="list-group">
    <a href="{{ url_for('auth.list_users') }}" class="list-group-item list-group-item-action">
      👥 Manage Users
    </a>
    <a href="{{ url_for('library.library_home') }}" class="list-group-item list-group-item-action">
      📚 Manage Virtual Library
    </a>
    <a href="{{ url_for('auth.logout') }}" class="list-group-item list-group-item-action text-danger">
      🚪 Logout
    </a>
  </div>
</div>
{% endblock %}
