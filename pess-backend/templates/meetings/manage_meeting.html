<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Meeting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-4">Manage Meeting</h3>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" value="{{ meeting.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Platform</label>
        <select name="platform" class="form-select" required>
          <option value="google" {% if meeting.platform == 'google' %}selected{% endif %}>Google Meet</option>
          <option value="zoom" {% if meeting.platform == 'zoom' %}selected{% endif %}>Zoom</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Meeting Link</label>
        <input type="url" name="link" class="form-control" value="{{ meeting.link }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        <input type="date" name="date" class="form-control" value="{{ meeting.date }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Time</label>
        <input type="time" name="time" class="form-control" value="{{ meeting.time }}" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Update Meeting</button>
    </form>

    <!-- Navigation buttons -->
    <div class="mt-3 d-flex justify-content-between">
      <a href="{{ url_for('meeting.list_meetings') }}" class="btn btn-secondary">Back to Meetings</a>
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-dark">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
