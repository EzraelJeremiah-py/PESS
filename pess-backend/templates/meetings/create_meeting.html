<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Meeting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #001f3f, #003366, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h3 {
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
      font-size: 1.6rem;
    }
    .card {
      border-radius: 14px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      font-size: 1rem;
    }
    label {
      font-size: 1.1rem;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-primary {
      background-color: #0074d9;
      border: none;
    }
    .btn-primary:hover {
      background-color: #005fa3;
    }
    .btn-secondary {
      background-color: #003366;
      border: none;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #001f3f;
    }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, li, a, label, input, select {
        font-size: 18px;
      }
      h3 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-4">Create New Meeting</h3>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Platform</label>
        <select name="platform" class="form-select" required>
          <option value="google">Google Meet</option>
          <option value="zoom">Zoom</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Meeting Link</label>
        <input type="url" name="link" class="form-control" placeholder="https://meet.google.com/..." required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        <input type="date" name="date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Time</label>
        <input type="time" name="time" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Meeting</button>
    </form>
    <a href="{{ url_for('meeting.list_meetings') }}" class="btn btn-secondary mt-3">Back</a>
  </div>
</body>
</html>
