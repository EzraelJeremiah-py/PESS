<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Meeting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-4">Create New Meeting</h3>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Platform</label>
        <select name="platform" class="form-select" required>
          <option value="google">Google Meet</option>
          <option value="zoom">Zoom</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Meeting Link</label>
        <input type="url" name="link" class="form-control" placeholder="https://meet.google.com/..." required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        <input type="date" name="date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Time</label>
        <input type="time" name="time" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Meeting</button>
    </form>
    <a href="{{ url_for('meeting.list_meetings') }}" class="btn btn-secondary mt-3">Back</a>
  </div>
</body>
</html>
