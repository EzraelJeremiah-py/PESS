<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meeting Connect Zone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-4">Virtual School Meetings</h3>
    <a href="{{ url_for('meeting.create_meeting') }}" class="btn btn-success mb-3">+ Create Meeting</a>

    {% if meetings %}
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-dark text-center">
        <tr>
          <th>Title</th>
          <th>Platform</th>
          <th>Date</th>
          <th>Time</th>
          <th>Link</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for m in meetings %}
        <tr class="text-center">
          <td>{{ m.title }}</td>
          <td>{{ m.platform }}</td>
          <td>{{ m.date }}</td>
          <td>{{ m.time }}</td>
          <td><a href="{{ m.link }}" target="_blank" class="btn btn-info btn-sm">Join</a></td>
          <td>
            <a href="{{ url_for('meeting.manage_meeting', id=m.id) }}" class="btn btn-warning btn-sm">Manage</a>
            <a href="{{ url_for('meeting.delete_meeting', id=m.id) }}" class="btn btn-danger btn-sm"
               onclick="return confirm('Delete this meeting?');">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <p class="text-center text-muted">No meetings scheduled.</p>
    {% endif %}

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
