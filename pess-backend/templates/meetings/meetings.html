<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meeting Connect Zone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      color: #fff;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(173,216,230,0.15); /* light blue glass */
      border: 1px solid rgba(0,255,255,0.3); /* cyan accent */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,255,255,0.4);
    }
    .table {
      color: #fff;
    }
    .table thead {
      background: rgba(0,0,0,0.7);
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-success {
      background-color: #00c6ff;
      border: none;
    }
    .btn-success:hover {
      background-color: #00a3cc;
    }
    .btn-info {
      background-color: #87cefa; /* light blue */
      border: none;
      color: #000;
    }
    .btn-info:hover {
      background-color: #00bfff;
      color: #fff;
    }
    .btn-warning {
      background-color: #ffcc00;
      border: none;
      color: #000;
    }
    .btn-danger {
      background-color: #ff4d4d;
      border: none;
    }
    .btn-secondary {
      background-color: #2a5298;
      border: none;
    }
    .text-white {
      color: #fff !important;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h3 class="mb-4"><i class="fas fa-video"></i> Virtual School Meetings</h3>
    <a href="{{ url_for('meeting.create_meeting') }}" class="btn btn-success mb-3">
      <i class="fas fa-plus"></i> Create Meeting
    </a>

    {% if meetings %}
    <div class="card shadow-lg">
      <div class="card-body">
        <table class="table table-bordered table-hover align-middle text-center">
          <thead>
            <tr>
              <th>Title</th>
              <th>Platform</th>
              <th>Date</th>
              <th>Time</th>
              <th>Link</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for m in meetings %}
            <tr>
              <td>{{ m.title }}</td>
              <td>{{ m.platform }}</td>
              <td>{{ m.date }}</td>
              <td>{{ m.time }}</td>
              <td><a href="{{ m.link }}" target="_blank" class="btn btn-info btn-sm"><i class="fas fa-sign-in-alt"></i> Join</a></td>
              <td>
                <a href="{{ url_for('meeting.manage_meeting', id=m.id) }}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i> Manage</a>
                <a href="{{ url_for('meeting.delete_meeting', id=m.id) }}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this meeting?');"><i class="fas fa-trash"></i> Delete</a>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    {% else %}
      <p class="text-center text-white">No meetings scheduled.</p>
    {% endif %}

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</body>
</html>
