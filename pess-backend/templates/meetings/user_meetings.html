<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Meetings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-4">Available Meetings</h3>
    <table class="table table-bordered table-hover text-center">
      <thead class="table-dark">
        <tr>
          <th>Title</th>
          <th>Platform</th>
          <th>Date</th>
          <th>Time</th>
          <th>Join</th>
        </tr>
      </thead>
      <tbody>
        {% for m in meetings %}
        <tr>
          <td>{{ m.title }}</td>
          <td>{{ m.platform }}</td>
          <td>{{ m.date }}</td>
          <td>{{ m.time }}</td>
          <td>
            <a href="{{ m.link }}" target="_blank" class="btn btn-success btn-sm">Join</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
