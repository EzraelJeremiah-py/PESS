<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parental Suggestion Box</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #001f3f, #003366, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      font-size: 1.1rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      color: #fff; /* ✅ White header text */
      font-weight: 700;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    /* ✅ Transparent floating blue card */
    .card {
      border-radius: 14px;
      background: rgba(0, 102, 204, 0.25); /* transparent blue */
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    label {
      font-size: 1.1rem;
      color: #fff;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    /* ✅ Submit button light green */
    .btn-primary {
      background-color: #90ee90; /* light green */
      border: none;
      color: #000;
    }
    .btn-primary:hover {
      background-color: #76c776;
    }
    .btn-secondary {
      background-color: #f0f0f0;
      border: none;
      color: #000;
    }
    .btn-secondary:hover {
      background-color: #dcdcdc;
    }
    @media (max-width: 768px) {
      body, p, li, a, label, input, textarea {
        font-size: 18px;
      }
      h2 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2>Parental Suggestion Box</h2>

    <!-- ✅ Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Sender</label>
        <input type="text" name="sender" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Suggestion</label>
        <textarea name="suggestion" class="form-control" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit Suggestion</button>
    </form>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ✅ Auto-dismiss flash messages after 5 seconds
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach(alert => {
        new bootstrap.Alert(alert).close();
      });
    }, 5000);
  </script>
</html>
