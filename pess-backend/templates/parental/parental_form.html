<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parental Suggestion Box</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #001f3f, #003366, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      color: #fff;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
      font-size: 1.6rem;
    }
    .card {
      border-radius: 14px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      font-size: 1rem;
    }
    label {
      font-size: 1.1rem;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-primary {
      background-color: #0074d9;
      border: none;
    }
    .btn-primary:hover {
      background-color: #005fa3;
    }
    .btn-secondary {
      background-color: #003366;
      border: none;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #001f3f;
    }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, li, a, label, input, textarea {
        font-size: 18px;
      }
      h2 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Parental Suggestion Box</h2>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Parent Name</label>
        <input type="text" name="parent_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Contact Number</label>
        <input type="text" name="contact_number" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Suggestion</label>
        <textarea name="suggestion" class="form-control" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit Suggestion</button>
    </form>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
