<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parental Suggestion Box</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Parental Suggestion Box</h2>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Parent Name</label>
        <input type="text" name="parent_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Contact Number</label>
        <input type="text" name="contact_number" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Suggestion</label>
        <textarea name="suggestion" class="form-control" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit Suggestion</button>
    </form>
  </div>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</body>
</html>
