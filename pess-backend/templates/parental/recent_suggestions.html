<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recent Suggestions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #001f3f, #003366, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 14s ease infinite;
      min-height: 100vh;
      color: #fff; /* ✅ all body text white */
      font-size: 1.1rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      color: #fff; /* ✅ heading white */
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      font-size: 1.6rem;
    }
    .list-group-item {
      font-size: 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; /* ✅ list item text white */
    }
    .text-primary {
      color: #fff !important; /* ✅ parent_name white */
      font-weight: 600;
    }
    .text-muted {
      color: #fff !important; /* ✅ created_at + "No approved suggestions yet" white */
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      color: #fff; /* ✅ button text white */
    }
    .btn-secondary {
      background-color: #003366;
      border: none;
    }
    .btn-secondary:hover {
      background-color: #001f3f;
    }
    @media (max-width: 768px) {
      body, p, li, a, span {
        font-size: 18px;
      }
      h2 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Recent Approved Suggestions</h2>
    <ul class="list-group shadow-sm">
      {% for s in suggestions %}
        <li class="list-group-item">
          <strong class="text-primary">{{ s.parent_name }}</strong><br>
          <span class="text-muted">{{ s.created_at }}</span>
          <p class="mt-2">{{ s.suggestion }}</p>
        </li>
      {% else %}
        <li class="list-group-item text-center text-muted">No approved suggestions yet.</li>
      {% endfor %}
    </ul>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
