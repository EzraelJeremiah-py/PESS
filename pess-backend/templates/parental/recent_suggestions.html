<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recent Suggestions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Recent Approved Suggestions</h2>
    <ul class="list-group shadow-sm">
      {% for s in suggestions %}
        <li class="list-group-item">
          <strong class="text-primary">{{ s.parent_name }}</strong> ({{ s.email }})<br>
          <span class="text-muted">{{ s.created_at }}</span>
          <p class="mt-2">{{ s.suggestion }}</p>
        </li>
      {% else %}
        <li class="list-group-item text-center text-muted">No approved suggestions yet.</li>
      {% endfor %}
    </ul>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
