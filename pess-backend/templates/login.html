<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 10s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 100%;
      max-width: 600px;
      color: #fff;
    }
    .btn-primary {
      background-color: #2a5298;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1e3c72;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: bold;
      font-size: 2rem; /* ✅ Larger heading */
    }
    h3 {
      font-size: 1.5rem;
    }
    label {
      color: #fff;
      font-size: 1.1rem;
    }
    a {
      color: #00c6ff;
      font-size: 1rem;
    }
    a:hover {
      color: #fff;
    }
    /* ✅ Pill badge top-right */
    .manual-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    .manual-badge .badge {
      font-size: 1.2rem;       /* ✅ Bigger text */
      padding: 0.8rem 1.4rem;  /* ✅ Larger pill */
      color: #fff !important;  /* ✅ Force white text */
      cursor: pointer;         /* ✅ Clickable */
    }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, label, a {
        font-size: 18px;
      }
      h1 {
        font-size: 24px;
      }
      h3 {
        font-size: 20px;
      }
      .manual-badge .badge {
        font-size: 18px;
        padding: 1rem 1.6rem;
      }
    }
  </style>
</head>
<body>
  <!-- Pill Badge -->
  <div class="manual-badge">
    <a href="/static/manual.html" class="badge bg-info rounded-pill fw-bold shadow">
      <i class="fas fa-book-open"></i> User System Manual
    </a>
  </div>

  <div class="container">
    <h1>Welcome to PESS</h1>
    <div class="d-flex justify-content-center">
      <div class="card shadow p-5">
        <h3 class="text-center mb-4">Login</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username / Serial</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">
          Don’t have an account? <a href="#">Register</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
