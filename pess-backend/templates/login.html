<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PESS Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #fff;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero {
      text-align: center;
      padding: 4rem 2rem;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .btn-cta {
      background-color: #00c6ff;
      border: none;
      font-size: 1.2rem;
      padding: 0.8rem 2rem;
      border-radius: 30px;
      transition: background 0.3s ease;
    }
    .btn-cta:hover {
      background-color: #1e3c72;
      color: #fff;
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
    }
    footer a {
      color: #fff;
      margin: 0 1rem;
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    footer a:hover {
      color: #00c6ff;
      text-shadow: 0 0 10px #00c6ff;
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to PESS</h1>
    <p>📚 Empowering Students, Parents & Admins with seamless engagement and support.</p>
    <a href="#login" class="btn btn-cta">Get Started</a>
  </section>

  <!-- Login Card -->
  <div class="container" id="login">
    <div class="d-flex justify-content-center">
      <div class="card shadow p-5 w-100" style="max-width: 600px;">
        <h3 class="text-center mb-4">Login</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username / Serial</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">
          Don’t have an account? 
          <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="d-flex justify-content-center gap-5 flex-wrap">
      <a href="/static/privacy.html"><i class="fas fa-shield-alt"></i> Privacy Policy</a>
      <a href="/static/faqs.html"><i class="fas fa-question-circle"></i> FAQs</a>
      <a href="/static/terms.html"><i class="fas fa-file-contract"></i> Terms of Service</a>
      <a href="/static/support.html"><i class="fas fa-headset"></i> Contact Support</a>
    </div>
    <p class="mt-3 text-muted">© 2026 PESS System | All Rights Reserved</p>
  </footer>
</body>
</html>
