<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 10s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-size: 1.1rem;
      flex-direction: column; /* ✅ allows footer at bottom */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 100%;
      max-width: 600px;
      color: #fff;
    }
    .btn-primary {
      background-color: #2a5298;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1e3c72;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: bold;
      font-size: 2rem;
    }
    h3 { font-size: 1.5rem; }
    label { color: #fff; font-size: 1.1rem; }
    a { color: #00c6ff; font-size: 1rem; }
    a:hover { color: #fff; }

    /* ✅ Transparent floating pill badge */
    .manual-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1200;
    }
    .manual-badge .badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 1.1rem;
      padding: 0.6rem 1.2rem;
      color: #fff !important;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .manual-badge .badge:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* ✅ Footer */
    footer {
      margin-top: auto; /* pushes footer to bottom */
      width: 100%;
      text-align: center;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.9rem;
    }

    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, label, a { font-size: 18px; }
      h1 { font-size: 24px; }
      h3 { font-size: 20px; }
      .manual-badge .badge {
        font-size: 18px;
        padding: 1rem 1.6rem;
      }
      footer { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <!-- Pill Badge -->
  <div class="manual-badge">
    <a href="/static/manual.html" class="badge rounded-pill fw-bold shadow">
      <i class="fas fa-book-open"></i> User System Manual
    </a>
  </div>

  <div class="container">
    <h1>Welcome to PESS</h1>
    <div class="d-flex justify-content-center">
      <div class="card shadow p-5">
        <h3 class="text-center mb-4">Login</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username / Serial</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">
          Don’t have an account? 
          <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
      </div>
    </div>
  </div>
  
  <!-- ✅ Professional Transparent Footer -->
  <footer class="footer mt-auto">
    <div class="container py-4">
      <div class="row text-center text-md-start">
        
        <!-- Column 1 -->
        <div class="col-md-3 mb-3">
          <h6 class="fw-bold text-light">About</h6>
          <a href="/static/privacy.html" class="d-block text-light">
            <i class="fas fa-shield-alt"></i> Privacy Policy
          </a>
          <a href="/static/terms.html" class="d-block text-light">
            <i class="fas fa-file-contract"></i> Terms of Service
          </a>
        </div>
        
        <!-- Column 2 -->
        <div class="col-md-3 mb-3">
          <h6 class="fw-bold text-light">Help</h6>
          <a href="/static/faqs.html" class="d-block text-light">
            <i class="fas fa-question-circle"></i> FAQs
          </a>
          <a href="/static/support.html" class="d-block text-light">
            <i class="fas fa-headset"></i> Contact Support
          </a>
        </div>
        
        <!-- Column 3 -->
        <div class="col-md-3 mb-3">
          <h6 class="fw-bold text-light">Resources</h6>
          <a href="/static/manual.html" class="d-block text-light">
            <i class="fas fa-book-open"></i> User Manual
          </a>
          <a href="#" class="d-block text-light">
            <i class="fas fa-blog"></i> Updates
          </a>
        </div>
        
        <!-- Column 4 -->
        <div class="col-md-3 mb-3">
          <h6 class="fw-bold text-light">Connect</h6>
          <a href="mailto:support@pess.com" class="d-block text-light">
            <i class="fas fa-envelope"></i> Email Us
          </a>
        <a href="tel:+265991626001" class="d-block text-light">
          <i class="fas fa-phone"></i> +265991626001
        </a>
        </div>
      </div>
      <!-- Bottom Line -->
      <div class="text-center mt-4">
        <p class="text-muted mb-0">© 2026 PESS System | </p>
      </div>
    </div>
  </footer>
  
  <style>
    .footer {
      background: rgba(255, 255, 255, 0.08); /* ✅ transparent frosted look */
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      color: #fff;
      width: 100%;
    }
    .footer a {
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .footer a:hover {
      color: #00c6ff !important;
      text-shadow: 0 0 10px #00c6ff;
    }
  </style>
