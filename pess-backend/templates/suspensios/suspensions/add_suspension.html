<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Suspension</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Add Suspension</h2>
    <form method="POST" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label fw-bold">Student Name</label>
        <input type="text" name="student_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Reason</label>
        <textarea name="reason" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Start Date</label>
        <input type="date" name="start_date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">End Date</label>
        <input type="date" name="end_date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Status</label>
        <select name="status" class="form-select">
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Suspension</button>
    </form>
    <a href="{{ url_for('suspensions.list_suspensions') }}" class="btn btn-secondary mt-3">Back to Suspensions List</a>
  </div>
</body>
</html>
