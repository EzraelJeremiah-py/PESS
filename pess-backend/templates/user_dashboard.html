<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">User Dashboard</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h2 class="mb-3">Welcome, {{ session['serial'] }}</h2>
    <p class="lead">This is your dashboard. Use the buttons below to access your records and meetings.</p>

    <!-- Dashboard Grid -->
    <div class="row">
      <!-- Fee Records -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center">
            <h5 class="card-title">Fee Payment Records</h5>
            <p class="card-text text-muted">View your uploaded fee payment files.</p>
            <a href="{{ url_for('fees.user_fee_files') }}" class="btn btn-primary w-100">View Records</a>
          </div>
        </div>
      </div>

      <!-- Meeting Connect Zone -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center">
            <h5 class="card-title">Meeting Connect Zone</h5>
            <p class="card-text text-muted">Join scheduled virtual school meetings.</p>
            <a href="{{ url_for('meetings.list_meetings') }}" class="btn btn-success w-100">Join Meetings</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
