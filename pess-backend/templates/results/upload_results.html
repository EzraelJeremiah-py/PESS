<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Results - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h2 {
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,198,255,0.6);
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      width: 100%;
      max-width: 600px;
    }
    label { color: #00e6e6; font-weight: 600; }
    .btn-info {
      background-color: #00c6ff;
      border: none;
      font-weight: 600;
    }
    .btn-info:hover { background-color: #0099cc; }
  </style>
</head>
<body>
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Upload Exam Results</h2>

    <!-- ✅ Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('results.upload') }}">
      <div class="mb-3">
        <label class="form-label">Select Result File</label>
        <input type="file" name="result_file" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-info w-100">Upload</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach(alert => {
        new bootstrap.Alert(alert).close();
      });
    }, 4000);
  </script>
</body>
</html>
