<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Virtual Library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <style>
    body { background-color: #0b0c10; color: #ffffff; }
    .sidebar {
      height: 100vh;
      background-color: #1f2833;
      padding: 20px;
      position: fixed;
      top: 0; left: 0;
      width: 220px;
    }
    .sidebar a {
      display: block;
      color: #00c6ff;
      padding: 10px;
      text-decoration: none;
      margin-bottom: 10px;
      border-radius: 5px;
    }
    .sidebar a:hover {
      background-color: #00c6ff;
      color: #0b0c10;
    }
    .content {
      margin-left: 240px;
      padding: 20px;
    }
    .btn-secondary { background-color: #1f2833; border: none; }
    .btn-info { background-color: #00c6ff; border: none; }
    .btn-success { background-color: #28a745; border: none; }
    .btn-primary { background-color: #007bff; border: none; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h4 class="text-white">📚 Library</h4>
    <a href="{{ url_for('library.books') }}">Books</a>
    <a href="{{ url_for('library.packages') }}">Packages</a>
    <a href="{{ url_for('library.links') }}">Links</a>
    <a href="{{ url_for('library.pastpapers') }}">Past Papers</a>
    <a href="{{ url_for('library.notifications') }}">Notifications</a>
    <a href="{{ url_for('admin.dashboard') }}" class="mt-3">⬅ Back to Dashboard</a>
  </div>

  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
