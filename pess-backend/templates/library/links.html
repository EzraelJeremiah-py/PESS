<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learning Links - Virtual Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      padding: 2rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      background: #fff;
      border-radius: 25px;
      color: #222;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
    }
    .btn {
      border-radius: 50px;
      font-weight: bold;
    }
    h2 {
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">🌐 Learning Links</h2>

    {% if session.get('role') == 'admin' %}
    <!-- Admin Add -->
    <div class="card mb-4 p-4">
      <h5 class="fw-bold text-info mb-3">Add New Link</h5>
      <form method="POST" action="{{ url_for('library.add_link') }}">
        <div class="mb-3">
          <input type="text" name="title" placeholder="Title" class="form-control rounded-pill" required>
        </div>
        <div class="mb-3">
          <input type="url" name="url" placeholder="URL" class="form-control rounded-pill" required>
        </div>
        <div class="mb-3">
          <textarea name="description" placeholder="Description" class="form-control rounded-pill"></textarea>
        </div>
        <button type="submit" class="btn btn-info w-100 rounded-pill">
          <i class="fas fa-plus"></i> Add Link
        </button>
      </form>
    </div>
    {% endif %}

    <!-- Links Grid -->
    <div class="row g-4">
      {% for link in links %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 p-4">
          <h5 class="fw-bold text-info">
            <i class="fas fa-link"></i> {{ link.title }}
          </h5>
          <p class="mb-2">{{ link.description }}</p>
          <div class="mt-3 d-flex justify-content-between">
            <a href="{{ link.url }}" target="_blank" class="btn btn-primary btn-sm rounded-pill">
              <i class="fas fa-eye"></i> View
            </a>
            {% if session.get('role') == 'admin' %}
            <a href="{{ url_for('admin.delete_link', link_id=link.id) }}" class="btn btn-danger btn-sm rounded-pill">
              <i class="fas fa-trash"></i> Delete
            </a>
            {% endif %}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
