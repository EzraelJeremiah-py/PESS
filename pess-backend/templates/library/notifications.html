<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications - Virtual Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <style>
    body { background-color: #0b0c10; color: #ffffff; }
    .card { border: 1px solid #00c6ff; }
    .btn-info { background-color: #00c6ff; border: none; }
    .btn-secondary { background-color: #1f2833; border: none; }
    .btn-primary { background-color: #007bff; border: none; }
    .list-group-item { border: none; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-3">🔔 Notifications</h2>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>

    <!-- Add Notification Form -->
    <form method="POST" action="{{ url_for('library.add_notification') }}" class="card p-3 shadow-lg bg-transparent">
      <textarea name="message" placeholder="Message" class="form-control mb-2" required></textarea>
      <select name="target_role" class="form-select mb-2">
        <option value="student">Student</option>
        <option value="parent">Parent</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit" class="btn btn-info">Add Notification</button>
    </form>

    <!-- Notifications List -->
    <ul class="list-group mt-3">
      {% for note in notes %}
      <li class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ note.target_role|capitalize }}</strong>: {{ note.message }}
          <small class="text-muted">({{ note.created_at }})</small>
        </div>
        <div>
          <!-- View button -->
          <a href="{{ url_for('library.notifications') }}#note{{ note.id }}" class="btn btn-primary btn-sm">View</a>
        </div>
      </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
