<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Official School Joining Instructions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      color: #fff;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(0,255,255,0.08); /* Cyan glass effect */
      border: 1px solid rgba(0,255,255,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,255,255,0.4);
    }
    .list-group-item {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
    }
    .list-group-item:hover {
      background: rgba(0,255,255,0.15);
    }
    .btn-primary {
      background-color: #00c6ff;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #00a3cc;
    }
    .btn-secondary {
      background-color: #2a5298;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h2 class="mb-3"><i class="fas fa-file-alt"></i> Official School Joining Instructions</h2>
        <p class="lead">Download your joining instructions below:</p>
        <ul class="list-group list-group-flush">
          {% for f in files %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <i class="fas fa-file-alt"></i> {{ f["original_name"] }}
              <small class="text-muted">({{ f["file_type"].upper() }}, {{ (f["size"]/1024)|round(1) }} KB)</small>
            </div>
            <a href="{{ url_for('joining.download_file', file_id=f['id']) }}" class="btn btn-primary btn-sm">
              <i class="fas fa-download"></i> Download
            </a>
          </li>
          {% else %}
          <li class="list-group-item text-center text-muted">No instructions available.</li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</body>
</html>
