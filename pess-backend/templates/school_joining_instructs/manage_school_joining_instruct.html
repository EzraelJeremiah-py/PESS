<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage School Joining Instructions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold"><i class="fas fa-cogs"></i> Admin Dashboard</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-3">Manage School Joining Instructions</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th>File</th>
              <th>Type</th>
              <th>Size</th>
              <th>Uploaded At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for f in files %}
            <tr>
              <td>{{ f["original_name"] }}</td>
              <td>{{ f["file_type"] }}</td>
              <td>{{ (f["size"]/1024)|round(1) }} KB</td>
              <td>{{ f["uploaded_at"] }}</td>
              <td>
                <a href="{{ url_for('joining.download_file', file_id=f['id']) }}" class="btn btn-success btn-sm">
                  <i class="fas fa-download"></i> Download
                </a>
                <form action="{{ url_for('joining.rename_file', file_id=f['id']) }}" method="POST" class="d-inline">
                  <div class="input-group input-group-sm">
                    <input type="text" name="new_name" placeholder="New name" class="form-control">
                    <button type="submit" class="btn btn-warning">Rename</button>
                  </div>
                </form>
                <a href="{{ url_for('joining.delete_file', file_id=f['id']) }}" class="btn btn-danger btn-sm">
                  <i class="fas fa-trash"></i> Delete
                </a>
              </td>
            </tr>
            {% else %}
            <tr>
              <td colspan="5" class="text-center text-muted">No files uploaded.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
