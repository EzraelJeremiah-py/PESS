<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Zone - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Teacher Chat Zone</h2>

    <!-- Chat Form -->
    <form method="POST" class="mb-4">
      <div class="mb-3">
        <label class="form-label">Channel</label>
        <input type="text" name="channel" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Tag (optional)</label>
        <input type="text" name="tag" class="form-control">
      </div>
      <button type="submit" class="btn btn-success w-100">Send Message</button>
    </form>

    <!-- Chat Messages -->
    <div class="card">
      <div class="card-header bg-primary text-white">
        Recent Messages
      </div>
      <div class="card-body">
        <ul class="list-group">
          {% for msg in messages %}
          <li class="list-group-item">
            <strong>{{ msg.sender }}</strong> 
            <span class="text-muted">[{{ msg.channel }}]</span>: 
            {{ msg.message }}
            {% if msg.tag %}
              <br><small class="badge bg-info">{{ msg.tag }}</small>
            {% endif %}
            <br>
            <small class="text-muted">{{ msg.timestamp }}</small>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
