<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PESS Chat Zone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .chat-card { border-radius: 12px; }
    .chat-window { height: 400px; overflow-y: auto; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; }
    .chat-message { margin-bottom: 15px; }
    .chat-message strong { color: #0d6efd; }
    .chat-bubble { background: #e9ecef; border-radius: 12px; padding: 10px 15px; display: inline-block; }
    .chat-bubble.teacher { background: #d1e7dd; } /* greenish for teacher */
    .chat-bubble.admin { background: #f8d7da; }   /* reddish for admin */
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="card shadow-lg chat-card p-4">
      <h2 class="mb-4 text-primary">💬 Teacher Chat Zone</h2>

      <!-- Chat Form -->
      <form method="POST" action="{{ url_for('chat.send_message') }}" class="mb-4">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">Channel</label>
            <select name="channel" class="form-select" required>
              <option value="general">General</option>
              <option value="subject">Subject Group</option>
              <option value="private">Private</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Tag</label>
            <select name="tag" class="form-select">
              <option value="">None</option>
              <option value="excuse">Excuse Request</option>
              <option value="functional">Functional Matter</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Message</label>
            <input type="text" name="message" class="form-control" placeholder="Type your message..." required>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-success w-100 fw-bold">📤 Send Message</button>
        </div>
      </form>

      <!-- Chat Window -->
      <div class="chat-window">
        {% for msg in messages %}
          <div class="chat-message">
            <strong>{{ msg['sender'] }}</strong>
            <span class="chat-bubble {% if msg['sender'] == session['username'] %}teacher{% else %}admin{% endif %}">
              {{ msg['message'] }}
            </span>
            {% if msg['tag'] %}
              <span class="badge bg-info ms-2">{{ msg['tag'] }}</span>
            {% endif %}
            <div><small class="text-muted">{{ msg['timestamp'] }}</small></div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>

</body>
</html>
