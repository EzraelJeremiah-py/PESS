<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Attendance Records</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #00c6ff, #0072ff); /* Cyan gradient */
      color: #fff;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      margin-bottom: 20px;
    }
    .table {
      background: rgba(255,255,255,0.9); /* ✅ Light background for contrast */
      border-radius: 12px;
      overflow-x: auto;
      font-size: clamp(12px, 2.5vw, 16px);
    }
    .table th {
      background-color: #00c6ff; /* Cyan header */
      color: #000;               /* Black text in header */
      text-align: center;
    }
    .table td {
      color: #000;               /* ✅ Black text for visibility */
      text-align: center;
      vertical-align: middle;
    }
    .alert {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
    }
    .btn-dashboard {
      display: inline-block;
      margin-top: 20px;
      background-color: #28a745; /* Green badge */
      color: #fff;               /* White text */
      font-weight: 600;
      border-radius: 20px;
      padding: 8px 16px;
      text-decoration: none;
    }
    .btn-dashboard:hover {
      background-color: #218838;
      color: #fff;
    }
    @media (max-width: 768px) {
      h2 { font-size: 1.4rem; }
      .table th, .table td { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="container mt-4 text-center">
  <h2>Your Attendance Records</h2>
  {% if records %}
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Date</th>
            <th>Status</th>
            <th>Class</th>
            <th>Marked By</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
          {% for rec in records %}
          <tr>
            <td>{{ rec.date }}</td>
            <td>{{ rec.status }}</td>
            <td>{{ rec.class_stream }}</td>
            <td>{{ rec.marked_by }}</td>
            <td>{{ rec.timestamp }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="alert alert-info">No attendance records found.</div>
  {% endif %}

  <!-- ✅ Back to Dashboard button -->
  <a href="{{ url_for('user.dashboard') }}" class="btn-dashboard">
    ⬅ Back to Dashboard
  </a>
</div>
</body>
</html>
