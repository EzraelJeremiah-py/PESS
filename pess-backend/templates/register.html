<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - PESS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      font-size: 1.1rem; /* ✅ Base font size */
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h3 {
      color: #00c6ff;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(0,198,255,0.6);
    }
    .card {
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,198,255,0.3);
      color: #fff;
      font-size: 1rem;
      width: 100%;
      max-width: 600px; /* ✅ Expanded width like Login */
    }
    label {
      font-weight: 600;
      color: #00e6e6;
      font-size: 1rem;
    }
    .btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-success {
      background-color: #00c6ff;
      border: none;
    }
    .btn-success:hover { background-color: #00a3cc; }
    a {
      color: #00c6ff;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    /* ✅ Bigger fonts on phones */
    @media (max-width: 768px) {
      body, p, li, a, label, input, button {
        font-size: 18px;
      }
      h3 {
        font-size: 22px;
      }
      .btn {
        font-size: 18px;
      }
    }
    /* ✅ Larger fonts & card on desktops */
    @media (min-width: 1200px) {
      body, p, li, a, label, input, button {
        font-size: 1.25rem;
      }
      h3 {
        font-size: 26px;
      }
      .card {
        max-width: 700px; /* ✅ Wider card for PC */
      }
      .btn {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4">
      <h3 class="text-center mb-4">Register</h3>

      <!-- ✅ Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label class="form-label">Serial</label>
          <input type="text" name="serial" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Class/Stream</label>
          <input type="text" name="class_stream" class="form-control" placeholder="e.g. Form1A" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <p class="text-center mt-3">
        Already registered? <a href="{{ url_for('auth.login') }}">Login</a>
      </p>
    </div>
  </div>

  <!-- ✅ Bootstrap JS for alerts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Auto-dismiss flash messages after 4 seconds -->
  <script>
    setTimeout(() => {
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(alert => {
        const bsAlert = new bootstrap.Alert(alert);
        bsAlert.close();
      });
    }, 4000);
  </script>
</body>
</html>
